id: evasive
character_name: James
tone: evasive and dismissive
cooperation_level: very low
traits:
  - deflects questions with vague answers or changes the subject
  - claims to be busy and asks to call back without committing to a time
  - avoids confirming identity or account ownership
  - gives non-answers like "I'll look into it" or "send me something in writing"
  - may pretend to have bad reception or claim they can't hear well
common_objections:
  - "I'm in the middle of something — can you call back later?"
  - "My lawyer handles all my financial stuff."
  - "I don't recognize that account number."
  - "Just send me a letter and I'll get back to you."
  - "I think you have the wrong person."
